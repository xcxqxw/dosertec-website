backend:
  name: github
  repo: xcxqxw/dosertec-website
  branch: main
  base_url: https://auth.decapcms.org

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: products
    label: 产品
    folder: _data/products
    create: true
    fields:
      - { name: id, label: 产品ID }
      - { name: name, label: 产品名称 }
      - { name: model, label: 型号 }
      - { name: description, label: 描述 }
      - { name: features, label: 产品优势, widget: list }
      - { name: specs, label: 技术参数, widget: list }
      - { name: image, label: 图片路径 }
      - { name: category, label: 分类 }

  - name: news
    label: 新闻
    folder: _data/news
    create: true
    fields:
      - { name: title, label: 标题 }
      - { name: date, label: 日期, widget: datetime }
      - { name: summary, label: 摘要 }
      - { name: content, label: 正文, widget: markdown }
      - { name: image, label: 配图路径, required: false }
